[project]
name = "isaac-roentgen-nav"
version = "0.1.0"
description = "Fluoroscopy-based robot pose estimation in Isaac Sim via differentiable DRR rendering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Max Mai"}]
keywords = ["isaac-sim", "fluoroscopy", "drr", "2d-3d-registration", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Host-side runtime dependencies only. The two heavy stacks live elsewhere:
#   * Isaac Sim has its own embedded Python at ~/isaacsim/kit/python/
#   * fluorosim runs inside its own Docker image
# These deps cover the small host-side glue scripts (visualizers, TCP client,
# ZMQ snapshot subscriber).
dependencies = [
    "numpy>=1.24",
    "pyzmq>=25.0",
    "matplotlib>=3.7",
    "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/MaxMai98/isaac_roentgen_nav"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project ships as scripts under scenes/ and bridge/, not as an installable
# package. We declare no packages so `pip install .` won't try to import them.
packages = []
